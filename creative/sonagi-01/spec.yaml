# Creative Spec — 이미지/음악/게임/SNS 의 공통 기준 (Single Source of Truth)
id: sonagi-01

character:
  name: 소나기
  concept: 여름 소나기와 함께 나타나 잠깐 쏟아붓고 사라지는 아이 — IT 용어를 쓰지 않는 계열
  personality: 변덕스럽고 시원시원하다. 오래 머무는 법이 없고, 지나간 자리는 늘 깨끗하다.
  backstory: |
    맑던 하늘이 갑자기 어두워지면 그 애가 온 것이다.
    커다란 연잎 하나를 우산처럼 쓰고 나타나 한바탕 퍼붓고는,
    물웅덩이만 몇 개 남기고 해가 나기 전에 가 버린다.

visual:
  style: soft anime illustration
  mood: fresh
  palette: 먹빛 청회색 · 짙은 연잎 초록 · 맑은 물빛 (비 오는 여름)
  hair: 젖은 청록빛 검정 단발, 끝에 물방울이 맺힘
  eyes: 맑은 물빛 회색
  clothes: 짚으로 엮은 도롱이(전통 비옷), 연회색 홑옷, 커다란 연잎을 우산처럼 씀
  background: 비가 쏟아지는 여름 정원, 물웅덩이의 파문, 젖은 돌담과 이끼
  # danbooru 태그 나열 (품질 프리픽스는 스크립트가 자동으로 붙인다)
  # 후보 4장은 아래 base 에 pose 를 하나씩 갈아 끼워 생성한다
  prompt: >
    1girl, solo, refreshed expression, bright eyes, slight open mouth,
    dark teal black hair, short bob hair, wet hair, water droplets on hair,
    clear grey eyes,
    straw rain cape, pale grey summer robe, holding a giant lotus leaf as umbrella,
    upper body portrait, three-quarter view, looking at viewer,
    summer rain, rain streaks, puddle ripples, wet stone wall, green moss,
    (fresh water splash:1.2), rim light, cinematic lighting
    BREAK
    detailed background, bokeh, depth of field, volumetric lighting
  pose_variants:
    - upper body portrait, three-quarter view, looking at viewer, holding a giant lotus leaf overhead
    - upper body, facing to the side, looking away, head tilt
    - upper body portrait, dynamic angle, arm reaching out, looking at viewer
    - upper body portrait, from below, looking up, arms crossed
  negative_extra: >
    1boy, male, sexy, seductive, cleavage, large breasts, revealing clothes,
    sultry, nsfw, full body, chibi, shiny, latex, bodysuit, skintight, wet clothes, see-through,
    swimsuit, bikini, cyber, neon, sci-fi, chain, snow, persimmon, dragon horns, seashell,
    sunset, reed field, plum blossom

music:
  genre: korean pop
  mood: [fresh, playful, rainy]
  vocal: female bright vocal
  bpm: 112
  instruments: [piano, light drums, rain ambience]

game:
  grade: SR
  character_type: playable
  basic_effect: 젖은 바닥을 미끄러지듯 달려 이동 속도가 빨라진다 (제안 — 구현 단계에서 확정)
  special_ability: 일정 점수마다 '소나기' — 폭우가 쏟아져 화면의 일반 똥이 아래로 씻겨 내려가 소멸한다 (제안 — 구현 단계에서 확정)
  player_display_size: null
