# Creative Spec — 이미지/음악/게임/SNS 의 공통 기준 (Single Source of Truth)
id: mireu-01

character:
  name: 미르
  concept: 여의주를 쥔 어린 용 ('미르' 는 용의 순우리말) — IT 용어를 쓰지 않는 계열
  personality: 느긋하고 도도하다. 좀처럼 서두르지 않지만 한번 마음먹으면 크게 움직인다.
  backstory: |
    구름 위에서 여의주를 굴리며 논다.
    소원 하나쯤은 들어줄 수 있지만 무엇을 빌지 정하는 건 언제나 사람 몫이라,
    미르는 그냥 구슬을 던져 주고 지켜본다.

visual:
  style: soft anime illustration
  mood: mystic
  palette: 옥빛 청록 · 금 · 먹빛 구름 (여의주의 빛)
  hair: 짙은 옥빛 청록 긴 머리, 끝이 물결처럼 흩어짐, 금빛 뿔 한 쌍
  eyes: 금색, 세로로 긴 용의 눈
  clothes: 비늘 문양을 금실로 수놓은 긴 도포, 어깨의 금장식, 목에 건 여의주 구슬
  background: 먹빛 구름 사이로 떠오른 금빛 여의주, 굽이치는 물결 문양
  # danbooru 태그 나열 (품질 프리픽스는 스크립트가 자동으로 붙인다)
  # 후보 4장은 아래 base 에 pose 를 하나씩 갈아 끼워 생성한다
  prompt: >
    1girl, solo, calm proud expression, faint smile,
    dark jade teal hair, long flowing hair, wavy hair ends, golden dragon horns,
    golden slit pupil eyes, small dragon scales on cheek,
    long oriental robe, gold embroidered scale pattern, gold shoulder ornament,
    glowing orb pendant, floating golden orb,
    upper body portrait, three-quarter view, looking at viewer,
    ink wash clouds, swirling wave pattern, jade and gold glow,
    (golden light particles:1.2), rim light, cinematic lighting
    BREAK
    detailed background, bokeh, depth of field, volumetric lighting
  pose_variants:
    - upper body portrait, three-quarter view, looking at viewer, hand raised holding the orb
    - upper body, facing to the side, looking away, head tilt
    - upper body portrait, dynamic angle, arm reaching out, looking at viewer
    - upper body portrait, from below, looking up, arms crossed
  negative_extra: >
    1boy, male, sexy, seductive, cleavage, large breasts, revealing clothes,
    sultry, nsfw, full body, chibi, shiny, latex, bodysuit, skintight,
    cyber, neon, sci-fi, chain, snow, persimmon, hanbok jeogori, plum blossom

music:
  genre: korean pop
  mood: [mystic, grand, calm]
  vocal: female airy vocal
  bpm: 76
  instruments: [daegeum, gayageum, orchestral strings]

game:
  grade: UR
  character_type: playable
  basic_effect: 구름을 타 낙하 속도의 영향을 덜 받는다 (제안 — 구현 단계에서 확정)
  special_ability: 일정 점수마다 '여의주' — 무작위 강력 버프 하나를 굴려 발동한다 (제안 — 구현 단계에서 확정)
  player_display_size: null
