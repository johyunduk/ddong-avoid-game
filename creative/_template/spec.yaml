# Creative Spec — 이미지/음악/게임/SNS 의 공통 기준 (Single Source of Truth)
# 새 캐릭터: creative/<id>/spec.yaml 로 복사해서 채운다.
id: <kebab-case-id>

character:
  name: <한글 이름>
  concept: <한 줄 컨셉>
  personality: <성격>
  backstory: |
    <2~3문장 설정. 게임 내 상세 팝업과 SNS 문구에 재사용된다.>

visual:
  style: soft anime illustration
  mood: <dreamy | cool | chaotic ...>
  palette: <pastel | neon | monochrome ...>
  hair: <색/길이>
  eyes: <색>
  clothes: <복장>
  background: <배경>
  # comfyui-generate.py --prompt 에 그대로 넣을 danbooru 태그 나열
  prompt: >
    1girl, solo, ...
  negative_extra: ""

music:
  genre: korean pop
  mood: [dreamy, nostalgic, bright]
  vocal: female husky vocal
  bpm: 105
  instruments: [violin, cello]

game:
  grade: UR                  # 등급외 | R | SR | UR
  character_type: playable
  basic_effect: <기본 효과 한 줄 — abilityParams.ts 의 DESC 와 일치시킬 것>
  special_ability: <특수 능력 한 줄>
  player_display_size: null  # [w, h] 또는 null(기본 [50,80])
