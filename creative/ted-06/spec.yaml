    - 01 밤 — 불타는 빌딩 역광
    - 02 무너지는 스카이라인 — 폭발과 낙하 잔해
    - 03 폭발 직후 — 갈라진 도로와 잔해 근경
    - 04 잔불 남은 밤거리 — 연기 기둥과 불티
  negative_extra: |
    gore/blood/corpse/weapon/soldier — 폭력 묘사가 아니라 배경 분위기까지만.
    fire on his clothes / hole in shirt — 화염이 인물 옷으로 번지는 아티팩트 차단.
    full body / legs / feet — 원본과 같은 상반신 규격 유지.

