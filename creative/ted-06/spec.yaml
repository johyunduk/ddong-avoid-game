    /create-character 의 '기존 캐릭터를 고쳐 달라는 요청' 규칙대로, 원본 워크플로 프롬프트를 기준선으로 삼았다.
    BREAK 앞(인물: 검은 짧은머리·아이보리 셔츠·청바지·주머니에 손·상반신 3/4 앵글)은 한 글자도 바꾸지 않고,
    BREAK 뒤 배경 줄만 '해질녘 도시 거리' -> '폭격 후 불타는 빌딩' 으로 교체했다.
    원본 네거티브(hoodie/jacket/formal suit/tie 금지)도 그대로 유지.
