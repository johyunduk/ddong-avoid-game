# Creative Spec — 이미지/음악/게임/SNS 의 공통 기준 (Single Source of Truth)
id: mogwa-01

character:
  name: 모과
  concept: 늦가을 과수원의 향기. 서두르지 않고 향으로 주위를 물들이는 아이 (요청 20260906010439-dj09jj)
  motif: 모과 열매 · 늦가을 과수원 · 향(香)
  naming_note: |
    IT·개발 용어를 쓰지 않는 계열(치비·무기·구미·매화·나이트). 식물 모티프에서 딴 두 글자 한국어 이름.
    기존 23종 및 진행 중 배치(별·소라·노을·소나기·버들·미르·까치·매화 등)와 이름·색·모티프가 겹치지 않는다.
  distinct_from: |
    매화(봄 꽃·분홍) / 버들(연둣빛 봄 강가) / 소라(남색 밤바다) / 별(남보라 밤하늘) /
    노을(자주·진홍 해질녘) / 소나기(먹빛 여름비) / 미르(옥빛 용) / 까치(흑백 겨울 아침)
    → 비어 있던 축인 '따뜻한 황금노랑 + 밤빛 갈색 · 늦가을 낮'을 잡았다.

visual:
  style: soft anime illustration
  mood: warm calm
  palette: 모과빛 황금노랑 · 밤빛 갈색 · 미색 (늦가을 아침 과수원)
  hair: 황금빛 노랑 긴 머리, 낮게 묶고 갈색 끈
  eyes: 따뜻한 호박빛 갈색
  clothes: 밤빛 갈색 저고리, 겨자빛 노랑 치마, 미색 속깃, 금실 모과 자수, 모과를 담은 채반
  background: 늦가을 모과 과수원 아침, 가지에 달린 노란 열매, 옅은 안개, 낮은 햇살
  pose_variants:
    - 01 정면 — 채반을 안고 미소
    - 02 옆모습 — 가지에서 열매를 따는 순간
    - 03 올려다본 각도 — 바람에 흩날리는 머리
    - 04 근접 — 열매의 향을 맡으며
  negative_extra: 파랑·분홍·은발 머리, 짐승 귀·꼬리, 현대 의상, 눈·비·밤·도시, 흰 저고리(단색화 방지)

music:
  status: PENDING

game:
  grade: null                 # 설정 제안은 확정 후 별도 지시
  character_type: illustration_only
  ability_direction: |
    아직 확정 아님. 비어 있는 기믹 축으로 '향(香)' 을 제안 가능 —
    향이 퍼지는 범위 안에서 똥을 끌어당기거나 밀어내는 인력/척력 계열.
    기존 능력(삭제·빔·부활·축적·감속)과 겹치지 않는다.
