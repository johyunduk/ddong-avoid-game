# Creative Spec — 이미지/음악/게임/SNS 의 공통 기준 (Single Source of Truth)
id: byeol-01

character:
  name: 별
  concept: 떨어지는 별을 주워 주머니에 모으는 아이 — IT 용어를 쓰지 않는 계열
  personality: 조용하고 욕심이 없다. 모으기만 할 뿐, 필요한 사람이 있으면 그냥 준다.
  backstory: |
    별똥별이 떨어지는 자리를 미리 알고 언덕에 올라가 앉아 있는다.
    주머니가 가득 차면 하나씩 꺼내 하늘로 돌려보내는데,
    그때마다 누군가의 소원이 하나씩 이루어진다고 한다.

visual:
  style: soft anime illustration
  mood: quiet night
  palette: 깊은 남보라 밤하늘 · 은빛 별가루 · 옅은 미색
  hair: 짙은 남보라 긴 머리, 은빛 별가루가 흩뿌려져 반짝임
  eyes: 은빛 회청색
  clothes: 밤하늘빛 남보라 망토, 옅은 미색 속옷깃, 별을 담는 작은 자루, 은색 별 브로치
  background: 별이 쏟아지는 밤하늘과 은하수, 풀이 덮인 언덕
  # danbooru 태그 나열 (품질 프리픽스는 스크립트가 자동으로 붙인다)
  # 후보 4장은 아래 base 에 pose 를 하나씩 갈아 끼워 생성한다
  prompt: >
    1girl, solo, quiet serene expression, faint smile,
    dark indigo purple hair, long straight hair, silver star glitter in hair,
    silver grey blue eyes,
    deep indigo night cloak, pale cream inner collar, small pouch of stars,
    silver star brooch, tiny glowing stars floating around,
    upper body portrait, three-quarter view, looking at viewer,
    starry night sky, milky way, grassy hill, shooting stars,
    (silver starlight:1.2), rim light, cinematic lighting
    BREAK
    detailed background, bokeh, depth of field, volumetric lighting
  pose_variants:
    - upper body portrait, three-quarter view, looking at viewer, holding a small glowing star
    - upper body, facing to the side, looking away, head tilt
    - upper body portrait, dynamic angle, arm reaching out, looking at viewer
    - upper body portrait, from below, looking up, arms crossed
  negative_extra: >
    1boy, male, sexy, seductive, cleavage, large breasts, revealing clothes,
    sultry, nsfw, full body, chibi, shiny, latex, bodysuit, skintight,
    cyber, neon, sci-fi, chain, snow, persimmon, dragon horns, seashell, ocean, beach,
    sunset, reed field, rain, lotus leaf, willow, plum blossom

music:
  genre: korean pop
  mood: [quiet, dreamy, night]
  vocal: female airy vocal
  bpm: 80
  instruments: [piano, celesta, ambient pad]

game:
  grade: SR
  character_type: playable
  basic_effect: 특수 똥을 수집할 때마다 별이 하나씩 주머니에 쌓인다 (제안 — 구현 단계에서 확정)
  special_ability: 별 5개마다 '소원' — 별 하나를 터뜨려 주변 똥을 별가루로 바꾸고 점수 2배로 거둔다 (제안 — 구현 단계에서 확정)
  player_display_size: null
