# Creative Spec — 이미지/음악/게임/SNS 의 공통 기준 (Single Source of Truth)
id: sora-01

character:
  name: 소라
  concept: 소라껍데기에 귀를 대면 다음에 올 파도가 들리는 아이 (proxy-01 기각의 대체 컨셉)
  personality: 말수가 적고 잘 듣는다. 먼저 나서지 않지만 위험이 오면 제일 먼저 안다.
  backstory: |
    해질 무렵 바닷가에서 주운 소라껍데기 하나를 늘 목에 걸고 다닌다.
    거기에 귀를 대면 아직 오지 않은 파도 소리가 먼저 들려서,
    소라는 남들보다 한 박자 빠르게 몸을 피한다.

visual:
  style: soft anime illustration
  mood: calm
  palette: 짙은 남색 밤바다 · 진주빛 크림 · 산호 분홍 포인트
  hair: 옅은 얼음빛 하늘색 긴 웨이브, 끝만 푸르게, 진주·조개 장식 (남색은 케이프로)
  eyes: 산호 분홍빛, 조용한 눈매
  clothes: 진주빛 크림 니트, 남색 케이프, 조개·소라 장식, 어깨에 두른 얇은 그물
  background: 해질 무렵의 밤바다, 밀려오는 파도와 물거품, 진주빛 달빛
  # danbooru 태그 나열 (품질 프리픽스는 스크립트가 자동으로 붙인다)
  # 후보 4장은 아래 base 에 pose 를 하나씩 갈아 끼워 생성한다
  prompt: >
    1girl, solo, quiet calm expression, gentle eyes,
    pale ice blue hair, long wavy hair, light blue gradient hair ends, pearl hair ornament,
    coral pink eyes,
    cream knit top, navy cape, seashell ornaments, conch shell pendant,
    thin fishing net over shoulder,
    upper body portrait, three-quarter view, looking at viewer,
    evening seaside, night ocean waves, sea foam, pearly moonlight,
    (soft blue glow:1.2), rim light, cinematic lighting
    BREAK
    detailed background, bokeh, depth of field, volumetric lighting
  pose_variants:
    - upper body portrait, three-quarter view, looking at viewer, holding conch shell to ear
    - upper body, facing to the side, looking away, head tilt
    - upper body portrait, dynamic angle, arm reaching out, looking at viewer
    - upper body portrait, from below, looking up, arms crossed
  negative_extra: >
    1boy, male, sexy, seductive, cleavage, large breasts, revealing clothes,
    sultry, nsfw, full body, chibi, shiny, latex, bodysuit, skintight, swimsuit, bikini,
    cyber, neon, sci-fi, chain, snow, persimmon, dragon horns, plum blossom

music:
  genre: korean pop
  mood: [calm, wistful, night]
  vocal: female soft vocal
  bpm: 82
  instruments: [piano, ambient pad, ocean drum]

game:
  grade: SR
  character_type: playable
  basic_effect: 다음에 떨어질 똥의 낙하 지점이 잠깐 미리 표시된다 (파도 소리를 먼저 듣는다) — 제안, 구현 단계에서 확정
  special_ability: 일정 점수마다 '밀물' — 파도가 밀려와 화면 아래쪽 똥을 잠시 밀어낸다 (제안 — 구현 단계에서 확정)
  player_display_size: null
