<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>후보 심사실</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground:#15131a; --surface:#1e1b25; --raised:#272231; --line:#37303f;
    --ink:#efeaf4; --muted:#a49dae; --faint:#6f6879; --accent:#b9a6ff;
    --accept:#5fd39a; --revise:#f0b45f; --reject:#ef7676;
    --body:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
    --display:"Gowun Batang",Georgia,serif;
    --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--ground); color:var(--ink); font-family:var(--body);
    font-size:15px; line-height:1.6; -webkit-text-size-adjust:100%;
  }
  a { color:var(--accent); text-decoration:none; }
  .wrap { max-width:1180px; margin:0 auto; padding:20px 14px calc(28px + env(safe-area-inset-bottom)); }
  @media (min-width:680px) { .wrap { padding:24px 16px 40px; } }
  .eyebrow { font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--faint); margin:0 0 6px; }
  h1 { font-family:var(--display); font-weight:700; font-size:26px; margin:0 0 10px;
    text-wrap:balance; letter-spacing:-.01em; }
  .back { display:inline-block; font-size:13px; color:var(--muted); margin-bottom:10px; }
  header { border-bottom:1px solid var(--line); padding-bottom:16px; }
  .meta { display:flex; flex-wrap:wrap; gap:4px 14px; color:var(--muted); font-size:13px; }
  .meta b { color:var(--ink); font-weight:500; }
  details summary { cursor:pointer; color:var(--muted); font-size:13px; width:max-content; margin-top:12px; }
  details summary:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }

  .empty { color:var(--muted); font-size:14px; padding:18px 2px; }

  /* 목록 */
  .rows { display:flex; flex-direction:column; gap:10px; margin:14px 0 36px; }
  .row { display:flex; gap:13px; align-items:center; padding:10px; text-decoration:none;
    background:var(--surface); border:1px solid var(--line); border-radius:12px; color:inherit; }
  .row:hover { border-color:var(--accent); }
  .row:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .row img { width:54px; height:81px; object-fit:cover; border-radius:8px; background:#0e0d12; flex:none; }
  .row-main { flex:1; min-width:0; }
  .row-title { font-weight:600; font-size:16px; margin:0 0 2px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  .row-sub { font-family:var(--mono); font-size:11px; color:var(--faint); }
  .state { font-size:12px; font-weight:600; padding:4px 10px; border-radius:999px; flex:none;
    background:var(--raised); color:var(--muted); }
  .state.wait { background:color-mix(in srgb,var(--accent) 22%,var(--surface)); color:var(--accent); }
  .state.accept { background:color-mix(in srgb,var(--accept) 25%,var(--surface)); color:var(--accept); }

  .sync { display:block; font-family:var(--mono); font-size:11px; color:var(--faint); margin-top:8px; }
  /* 확정된 일러스트 (설정 화면에서 참고용 한 장) */
  .picked { display:block; width:min(220px,60vw); aspect-ratio:2/3; object-fit:cover;
    border-radius:12px; background:#0e0d12; border:1px solid var(--line); margin:18px 0 22px; }

  footer { color:var(--faint); font-size:12px; padding:18px 0 0; }

  /* 캐릭터 설정 */
  .setup { border-top:1px solid var(--line); padding-top:22px; margin-bottom:26px; }
  .setup h2 { font-family:var(--display); font-size:20px; margin:0 0 4px; }
  .setup .lead { color:var(--muted); font-size:13px; margin:0 0 18px; }
  .field { display:block; margin-bottom:20px; }
  .field > span { display:block; font-size:13px; font-weight:600; color:var(--muted); margin-bottom:7px; }
  .field input, .field textarea { width:100%; font-family:var(--body); font-size:16px; color:var(--ink);
    background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:11px 13px; }
  .field textarea { min-height:74px; resize:vertical; line-height:1.55; }
  .field input:focus-visible, .field textarea:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .hint { font-size:12px; color:var(--faint); margin:7px 0 0; }
  .grades { display:flex; gap:8px; flex-wrap:wrap; }
  .grades button { font-family:var(--body); font-size:15px; font-weight:600; color:var(--muted);
    background:var(--surface); border:1px solid var(--line); border-radius:999px;
    padding:10px 20px; cursor:pointer; }
  .grades button[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#1b1424; }
  .props { display:flex; flex-direction:column; gap:8px; margin-bottom:10px; }
  .props button { text-align:left; font-family:var(--body); font-size:14px; color:var(--ink);
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:11px 13px; cursor:pointer; }
  .props button[aria-pressed="true"] { border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,var(--surface)); }
  .props b { display:block; font-size:13px; color:var(--accent); margin-bottom:2px; font-weight:600; }
  .setup-actions { display:flex; align-items:center; gap:12px; }
  .setup-actions button { font-family:var(--body); font-size:16px; font-weight:600; color:#1b1424;
    background:var(--accent); border:0; border-radius:10px; padding:13px 24px; cursor:pointer; }
  .setup-actions button:disabled { background:var(--raised); color:var(--faint); }
  .setup-actions .sync { text-align:left; }

  /* 컨셉 요청 */
  .ckpt { display:flex; align-items:center; gap:8px; margin:0 0 10px; }
  .ckpt span { font-family:var(--mono); font-size:11px; letter-spacing:.08em; color:var(--faint); }
  .ckpt select { flex:1; font-family:var(--body); font-size:13px; padding:7px 9px;
    background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:8px; }
  .ckpt select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .request { border-top:1px solid var(--line); padding-top:22px; margin-bottom:30px; }
  .request h2 { font-family:var(--display); font-size:20px; margin:0 0 4px; }
  .request .lead { color:var(--muted); font-size:13px; margin:0 0 12px; }
  .reqs-head { font-size:13px; color:var(--muted); margin:18px 0 0; }
  .auto-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .auto-grid button { display:flex; flex-direction:column; gap:3px; align-items:flex-start;
    text-align:left; font-family:var(--body); color:var(--ink); background:var(--surface);
    border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line)); border-radius:12px;
    padding:14px 15px; cursor:pointer; }
  .auto-grid button:hover { border-color:var(--accent); }
  .auto-grid button:disabled { opacity:.5; cursor:not-allowed; }
  .auto-grid b { font-size:15px; font-weight:600; }
  .auto-grid span { font-family:var(--mono); font-size:11px; color:var(--faint); }
  .manual { margin-top:12px; }
  .manual summary { cursor:pointer; color:var(--muted); font-size:13px; width:max-content; }
  .manual summary:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
  .manual form { margin-top:10px; }
  .request form { display:flex; flex-direction:column; gap:8px; align-items:flex-start; }
  .request textarea { width:100%; min-height:80px; resize:vertical; font-family:var(--body);
    font-size:16px; line-height:1.55; color:var(--ink); background:var(--surface);
    border:1px solid var(--line); border-radius:10px; padding:11px 13px; }
  .req-actions { display:flex; gap:8px; flex-wrap:wrap; }
  .request button { font-family:var(--body); font-size:14px; font-weight:600; color:#1b1424;
    background:var(--accent); border:0; border-radius:10px; padding:12px 18px; cursor:pointer; }
  .request button.ghost { background:transparent; color:var(--accent);
    border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line)); }
  .request button:disabled { background:var(--raised); color:var(--faint); border-color:var(--line); }
  .req-sent { font-family:var(--mono); font-size:11px; color:var(--faint); }
  .reqs { display:flex; flex-direction:column; gap:8px; margin-top:18px; }
  .req { display:flex; gap:12px; align-items:flex-start; background:var(--surface);
    border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .req p { margin:0; font-size:14px; flex:1; min-width:0; overflow-wrap:anywhere; }
  .req time { font-family:var(--mono); font-size:11px; color:var(--faint); display:block; margin-top:3px; }
  .req .kind { font-size:11px; font-weight:600; color:var(--faint); margin-left:6px; }

  /* 안내 / 키 */
  .center { display:grid; place-items:center; min-height:80vh; text-align:center; padding:24px; }
  .center h2 { font-family:var(--display); font-size:20px; margin:0 0 8px; }
  .center p { color:var(--muted); font-size:14px; margin:0 0 16px; max-width:34em; }
  .keyform { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .keyform input { font-family:var(--mono); font-size:16px; color:var(--ink); background:var(--surface);
    border:1px solid var(--line); border-radius:9px; padding:10px 12px; min-width:240px; }
  .keyform button { font-family:var(--body); font-size:15px; font-weight:600; color:#1b1424;
    background:var(--accent); border:0; border-radius:9px; padding:11px 18px; cursor:pointer; }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
  /* 테마곡 */
  .music { border-top:1px solid var(--line); margin-top:28px; padding-top:20px; }
  .music h2 { font-family:var(--display); font-size:19px; margin:0 0 4px; }
  .music .lead { color:var(--muted); font-size:13px; margin:0 0 14px; }
  .roster { display:grid; grid-template-columns:repeat(auto-fill,minmax(76px,1fr)); gap:8px; }
  .roster button { font-family:var(--body); background:var(--surface); border:1px solid var(--line);
    border-radius:12px; padding:6px 5px 8px; cursor:pointer; color:var(--muted);
    display:flex; flex-direction:column; align-items:center; gap:5px; }
  .roster button[aria-pressed="true"] { border-color:var(--accent); color:var(--ink);
    background:color-mix(in srgb,var(--accent) 16%,var(--surface)); }
  .roster button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .roster img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px;
    background:var(--raised); }
  .roster .nm { font-size:12px; font-weight:500; line-height:1.2; text-align:center; }
  .roster .gr { font-family:var(--mono); font-size:9px; letter-spacing:.08em; color:var(--faint); }
  .music-form { margin-top:14px; display:none; }
  .music-form.on { display:block; }
  .music-form textarea { width:100%; min-height:64px; font-family:var(--body); font-size:14px;
    color:var(--ink); background:var(--surface); border:1px solid var(--line);
    border-radius:10px; padding:10px 12px; resize:vertical; }
  .music-form button { margin-top:8px; font-family:var(--body); font-size:14px; font-weight:600;
    background:var(--accent); color:#1b1424; border:0; border-radius:999px;
    padding:10px 18px; cursor:pointer; }
  .music-form button:disabled { opacity:.5; cursor:default; }
  /* 곡 판정 — 후보가 올라온 주문 (status review) */
  .verdicts { display:flex; flex-direction:column; gap:10px; margin-bottom:16px; }
  .verdict { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .verdict h3 { font-size:15px; margin:0 0 2px; }
  .verdict .ask { color:var(--muted); font-size:12px; margin:0 0 8px; }
  .verdict .trk { display:flex; align-items:center; gap:8px; padding:6px 0; border-top:1px solid var(--line); }
  .verdict .trk a { flex:1; min-width:0; color:var(--ink); font-size:14px; overflow-wrap:anywhere; }
  .verdict button { font-family:var(--body); font-size:13px; font-weight:600; border-radius:999px;
    padding:7px 13px; cursor:pointer; border:1px solid var(--line); background:var(--raised); color:var(--ink); }
  .verdict button.pick { background:var(--accent); color:#1b1424; border:0; }
  .verdict button:disabled { opacity:.5; cursor:default; }
  .verdict textarea { width:100%; min-height:48px; margin-top:8px; font-family:var(--body); font-size:13px;
    color:var(--ink); background:var(--raised); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  .verdict .row { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; align-items:center; }
  .verdict .sync { color:var(--muted); font-size:12px; }
  /* 상태 점 — 진행 중이면 빨강, 다 끝났으면 초록 */
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%;
    margin-left:8px; vertical-align:middle; }
  .dot.busy { background:var(--reject); }
  .dot.done { background:var(--accept); }

  /* 만드는 중인 캐릭터의 일러스트 위에 도는 고리 */
  .roster .ph { position:relative; display:block; width:100%; aspect-ratio:1; }
  .roster .spin { position:absolute; left:50%; top:50%;
    width:26px; height:26px; margin:-13px 0 0 -13px; border-radius:50%;
    border:2px solid color-mix(in srgb,var(--ink) 25%,transparent);
    border-top-color:var(--ink); animation:spin .8s linear infinite; }
  .roster button.busy img { opacity:.35; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion:reduce) {
    .roster .spin { animation-duration:2.4s; }
  }
</style>
</head>
<body>
<div id="app" class="center"><div><h2>불러오는 중</h2><p>잠시만 기다려 주세요.</p></div></div>

<template id="tpl-list">
  <div class="wrap">
    <header>
      <p class="eyebrow">컨셉 · 테마곡 · 캐릭터 설정</p>
      <h1>심사실</h1>
    </header>

    <section class="request">
      <h2>새 컨셉 만들기</h2>
      <label class="ckpt" id="ckpt-wrap" hidden>
        <span>체크포인트</span>
        <select id="req-model"></select>
      </label>
      <div class="auto-grid">
        <button type="button" id="req-auto-it">
          <b>IT 용어 계열</b><span>루트 · 글리치 · 세션</span>
        </button>
        <button type="button" id="req-auto-free">
          <b>그 외 계열</b><span>치비 · 무기 · 매화</span>
        </button>
      </div>

      <details class="manual" id="manual">
        <summary>컨셉을 직접 적기</summary>
        <form id="req-form">
          <textarea id="req-text" placeholder="예: 비 오는 날 우산 든 캐릭터, 차분한 성격"></textarea>
          <button type="submit">이 컨셉으로 요청</button>
        </form>
      </details>

      <span class="req-sent" id="req-sync"></span>
      <div class="reqs" id="reqs"></div>
    </section>

    <section class="music">
      <h2>테마곡 만들기<span class="dot" id="music-dot" hidden></span></h2>
      <p class="lead">게임에 들어가 있는 캐릭터를 고르면, PC 가 일러스트를 보고 분위기를 맞춰 곡을 만듭니다.</p>
      <div class="verdicts" id="music-review" hidden></div>
      <div class="roster" id="roster"></div>
      <div class="music-form" id="music-form">
        <textarea id="music-note" placeholder="분위기 요청 (비워 두면 일러스트만 보고 잡습니다)"></textarea>
        <button type="button" id="music-send">이 캐릭터로 곡 요청</button>
        <span class="req-sent" id="music-sync"></span>
      </div>
    </section>

    <section class="setup" id="setups" hidden>
      <h2>캐릭터 설정</h2>
      <p class="lead">확정된 캐릭터의 이름·등급·능력을 정합니다.</p>
      <div class="rows" id="rows"></div>
    </section>

    <footer>결정을 제출하면 PC 의 파이프라인이 이어서 진행합니다.</footer>
  </div>
</template>

<template id="tpl-detail">
  <div class="wrap">
    <header>
      <a class="back" href="./" id="back">← 목록</a>
      <p class="eyebrow">캐릭터 설정</p>
      <h1 id="title"></h1>
      <div class="meta" id="meta"></div>
    </header>

    <img class="picked" id="picked-img" alt="확정된 일러스트" hidden>

    <section class="setup" id="setup">
      <h2>캐릭터 설정</h2>
      <p class="lead" id="setup-lead">제안을 누르면 아래 칸이 채워집니다. 그대로 고쳐 쓰셔도 됩니다.</p>
      <label class="field"><span>이름</span>
        <input type="text" id="ch-name" maxlength="20" placeholder="예: 까치"></label>
      <div class="field"><span>등급</span>
        <div class="grades" id="ch-grades"></div>
        <p class="hint" id="grade-hint"></p></div>
      <div class="field"><span>기본 효과</span>
        <div class="props" id="prop-basic"></div>
        <textarea id="ch-basic" placeholder="없으면 '없음'"></textarea></div>
      <div class="field"><span>특수 능력</span>
        <div class="props" id="prop-special"></div>
        <textarea id="ch-special" placeholder="없으면 '없음'"></textarea></div>
      <div class="setup-actions">
        <button type="button" id="ch-save">설정 저장</button>
        <span class="sync" id="ch-sync"></span>
      </div>
    </section>

    <footer id="foot"></footer>
  </div>
</template>

<script>
(function () {
  var API = 'https://ebkffyzjjfzegrwvrzqw.supabase.co/functions/v1/review';
  var KEY_STORE = 'review_key';
  var REQ_STATE = { pending: '대기', picked: '처리 중', done: '완료', dropped: '보류' };
  var GRADES = ['등급외', 'R', 'SR', 'UR'];

  var app = document.getElementById('app');
  var q = new URLSearchParams(location.search);
  var batch = q.get('b') || '';
  var token = q.get('t') || '';
  var key = q.get('k') || '';

  try {
    if (key) {
      localStorage.setItem(KEY_STORE, key);
      q.delete('k');
      history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : ''));
    } else {
      key = localStorage.getItem(KEY_STORE) || '';
    }
  } catch (e) {}

  function view(tpl) {
    app.className = '';
    app.innerHTML = '';
    app.appendChild(document.getElementById(tpl).content.cloneNode(true));
  }

  function message(title, detail, withKeyForm) {
    app.className = 'center';
    app.innerHTML = '';
    var box = document.createElement('div');
    var h = document.createElement('h2'); h.textContent = title;
    var p = document.createElement('p'); p.textContent = detail;
    box.appendChild(h); box.appendChild(p);
    if (withKeyForm) {
      var form = document.createElement('form');
      form.className = 'keyform';
      var input = document.createElement('input');
      input.type = 'password'; input.placeholder = '심사 키'; input.autocomplete = 'off';
      var btn = document.createElement('button');
      btn.type = 'submit'; btn.textContent = '저장';
      form.appendChild(input); form.appendChild(btn);
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (!input.value.trim()) return;
        try { localStorage.setItem(KEY_STORE, input.value.trim()); } catch (err) {}
        location.href = './';
      });
      box.appendChild(form);
    }
    app.appendChild(box);
  }

  // '까치 · 1라운드' → '까치' (2라운드부터는 그대로 둔다)
  function trimRound(label) {
    return (label || '').replace(/\s*·\s*1\s*라운드\s*$/, '');
  }

  function get(params) {
    return fetch(API + '?' + params).then(function (r) {
      if (r.status === 403) throw new Error('열람 권한이 없습니다 (키 또는 토큰 불일치).');
      if (r.status === 404) throw new Error('해당 배치를 찾을 수 없습니다.');
      if (!r.ok) throw new Error('서버 오류 (HTTP ' + r.status + ')');
      return r.json();
    });
  }

  // ── 목록 ────────────────────────────────────────────────────────────────
  // 일러스트 후보 심사는 없어졌다 (2026-09-17 — 후보는 ComfyUI 출력 폴더에서 직접 본다).
  // 배치 목록은 '캐릭터 설정' 이 남은 확정 배치를 찾는 데만 쓴다.
  function isAccepted(b) { return !!(b.decision && b.decision.type === 'accept'); }

  function showList() {
    if (!key) {
      message('심사 키가 필요합니다', '푸시 알림으로 받은 링크를 열거나, 심사 키를 입력하세요. 한 번 저장하면 이 기기에서는 다시 묻지 않습니다.', true);
      return;
    }
    get('list=1&k=' + encodeURIComponent(key)).then(function (data) {
      view('tpl-list');
      paintRows(data.batches || []);
      bindRequestForm();
      loadRequests();
      bindMusic();
      loadMusic();

      // 앱을 나갔다 돌아오면 목록을 조용히 다시 받는다 (화면은 유지)
      onBackToView(function () {
        get('list=1&k=' + encodeURIComponent(key)).then(function (fresh) {
          paintRows(fresh.batches || []);
          loadRequests();
          loadMusic();
        }).catch(function () {});
      });
    }).catch(function (e) {
      message('목록을 열 수 없습니다', e.message, true);
    });
  }

  /** 뒤로가기 복원(bfcache)·앱 복귀 시 콜백. 두 경우 모두 화면이 낡아 있다. */
  function onBackToView(fn) {
    window.addEventListener('pageshow', function (e) { if (e.persisted) fn(); });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) fn();
    });
  }

  // 확정된 배치만 — 캐릭터 설정을 고를 대상이다. 없으면 섹션째 숨긴다.
  function paintRows(batches) {
    var list = batches.filter(isAccepted);
    var section = document.getElementById('setups');
    var rows = document.getElementById('rows');
    if (!section || !rows) return;
    rows.innerHTML = '';
    section.hidden = !list.length;

    list.forEach(function (b) {
      var a = document.createElement('a');
      a.className = 'row';
      a.href = './?b=' + encodeURIComponent(b.batch) + '&t=' + encodeURIComponent(b.token);

      if (b.thumb) {
        var img = document.createElement('img');
        img.src = b.thumb; img.alt = ''; img.loading = 'lazy';
        a.appendChild(img);
      }

      var main = document.createElement('div');
      main.className = 'row-main';
      var t = document.createElement('p');
      t.className = 'row-title';
      t.textContent = (b.character && b.character.name) || trimRound(b.label);
      var s = document.createElement('div');
      s.className = 'row-sub';
      s.textContent = b.created + ' · ' + b.batch;
      main.appendChild(t); main.appendChild(s);
      a.appendChild(main);

      var ch = b.character || {};
      var state = document.createElement('span');
      if (ch.confirmed) {
        state.className = 'state accept'; state.textContent = '설정 완료';
      } else if (ch.hasProposals) {
        state.className = 'state wait'; state.textContent = '선택 대기';
      } else {
        state.className = 'state'; state.textContent = '제안 준비 중';
      }
      a.appendChild(state);
      rows.appendChild(a);
    });
  }

  // ── 캐릭터 설정 (확정된 배치 하나) ──────────────────────────────────────
  function showDetail() {
    var auth = token ? 't=' + encodeURIComponent(token) : 'k=' + encodeURIComponent(key);
    var endpoint = API + '?b=' + encodeURIComponent(batch) + '&' + auth;
    var D = null;

    get('b=' + encodeURIComponent(batch) + '&' + auth).then(function (data) {
      D = data;
      view('tpl-detail');
      document.title = trimRound(D.label) + ' · 캐릭터 설정';
      document.getElementById('title').textContent = trimRound(D.label);
      if (!key) document.getElementById('back').style.display = 'none';

      var meta = document.getElementById('meta');
      [['생성', D.created], ['배치', D.batch]]
        .forEach(function (pair) {
          var s = document.createElement('span');
          s.appendChild(document.createTextNode(pair[0] + ' '));
          var b = document.createElement('b'); b.textContent = pair[1];
          s.appendChild(b); meta.appendChild(s);
        });
      document.getElementById('foot').textContent = '저장하면 PC 의 워커가 게임에 반영합니다.';

      paint();

      // 복귀 시 갱신 — 다만 캐릭터 설정을 입력 중이면 덮어쓰지 않는다
      onBackToView(function () {
        if (isSetupDirty()) { chSync('새 내용이 있을 수 있습니다 · 저장 후 새로고침하세요'); return; }
        get('b=' + encodeURIComponent(batch) + '&' + auth).then(function (fresh) {
          D = fresh;
          paint();
        }).catch(function () {});
      });
    }).catch(function (e) {
      message('열 수 없습니다', e.message, !key);
    });

    function paint() {
      // 참고용으로 확정된 한 장만 보여 준다 (예전 배치에만 남아 있다)
      var img = document.getElementById('picked-img');
      var sel = (D.candidates || []).filter(function (c) { return c.selected && c.src; })[0];
      if (sel) { img.src = sel.src; img.hidden = false; } else { img.hidden = true; }
      setupSection();
    }

    // ── 캐릭터 설정 ───────────────────────────────────────────────────────
    function setupSection() {
      var box = document.getElementById('setup');
      if (!D.decision || D.decision.type !== 'accept') {
        box.hidden = true;
        chSync('');
        document.getElementById('foot').textContent = '확정된 배치가 아니라 캐릭터 설정을 할 수 없습니다.';
        return;
      }
      box.hidden = false;

      var ch = D.character || {};
      var pr = ch.proposals || null;
      document.getElementById('ch-name').value = ch.name || '';
      document.getElementById('ch-basic').value = ch.basicEffect || '';
      document.getElementById('ch-special').value = ch.specialAbility || '';

      var gradeBox = document.getElementById('ch-grades');
      var grade = ch.grade || (pr && pr.grade) || '';
      if (!gradeBox.dataset.built) {
        gradeBox.dataset.built = '1';
        GRADES.forEach(function (g) {
          var b = document.createElement('button');
          b.type = 'button'; b.textContent = g;
          b.addEventListener('click', function () {
            grade = g;
            gradeBox.querySelectorAll('button').forEach(function (x) {
              x.setAttribute('aria-pressed', String(x.textContent === grade));
            });
          });
          gradeBox.appendChild(b);
        });
      }
      gradeBox.querySelectorAll('button').forEach(function (x) {
        x.setAttribute('aria-pressed', String(x.textContent === grade));
      });
      document.getElementById('grade-hint').textContent =
        pr && pr.gradeReason ? '제안: ' + (pr.grade || '') + ' — ' + pr.gradeReason : '';

      fillProps('prop-basic', pr && pr.basic, 'ch-basic');
      fillProps('prop-special', pr && pr.special, 'ch-special');

      var lead = document.getElementById('setup-lead');
      if (!pr) lead.textContent = 'PC 에서 제안을 만드는 중입니다. 잠시 뒤 새로고침하면 선택지가 뜹니다. 지금 직접 적으셔도 됩니다.';
      else if (ch.confirmed) lead.textContent = '저장된 설정입니다. 고치고 다시 저장하면 덮어씁니다.';

      document.getElementById('ch-save').onclick = function () {
        var save = this;
        var name = document.getElementById('ch-name').value.trim();
        if (!name) { chSync('이름을 적어주세요'); return; }
        if (!grade) { chSync('등급을 골라주세요'); return; }
        save.disabled = true; chSync('저장 중');
        fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ character: {
            name: name, grade: grade,
            basicEffect: document.getElementById('ch-basic').value.trim() || '없음',
            specialAbility: document.getElementById('ch-special').value.trim() || '없음',
            confirmed: true
          } })
        }).then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        }).then(function (res) {
          D.character = res.character;
          chSync('저장됨 — 워커가 게임에 반영합니다');
        }).catch(function (e) { chSync('저장 실패 — ' + e.message); })
          .then(function () { save.disabled = false; });
      };
    }

    function fillProps(boxId, list, targetId) {
      var box = document.getElementById(boxId);
      box.innerHTML = '';
      if (!list || !list.length) return;
      list.forEach(function (p) {
        var b = document.createElement('button');
        b.type = 'button'; b.setAttribute('aria-pressed', 'false');
        var t = document.createElement('b'); t.textContent = p.title || '제안';
        b.appendChild(t);
        b.appendChild(document.createTextNode(p.text));
        b.addEventListener('click', function () {
          document.getElementById(targetId).value = p.text;
          box.querySelectorAll('button').forEach(function (x) {
            x.setAttribute('aria-pressed', String(x === b));
          });
        });
        box.appendChild(b);
      });
    }

    function chSync(t) { document.getElementById('ch-sync').textContent = t; }

    /** 캐릭터 설정 칸에 저장 안 된 입력이 있으면 true */
    function isSetupDirty() {
      var box = document.getElementById('setup');
      if (!box || box.hidden) return false;
      var ch = (D && D.character) || {};
      var v = function (id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; };
      return v('ch-name') !== (ch.name || '')
          || v('ch-basic') !== (ch.basicEffect || '')
          || v('ch-special') !== (ch.specialAbility || '');
    }
  }

  // ── 컨셉 요청 ───────────────────────────────────────────────────────────
  function bindRequestForm() {
    var form = document.getElementById('req-form');
    var text = document.getElementById('req-text');
    var btn = form.querySelector('button');
    var sync = document.getElementById('req-sync');
    var autos = [document.getElementById('req-auto-it'), document.getElementById('req-auto-free')];
    var manual = document.getElementById('manual');

    var modelSel = document.getElementById('req-model');

    function send(payload, label) {
      // 체크포인트는 세 경로가 같은 select 를 쓴다. 비어 있으면 실어 보내지 않고,
      // 그 경우 생성 쪽이 bindings.json 의 기본값을 쓴다.
      if (modelSel && modelSel.value) payload.model = modelSel.value;
      btn.disabled = true; autos.forEach(function (a) { a.disabled = true; });
      sync.textContent = '보내는 중';
      return fetch(API + '?request=1&k=' + encodeURIComponent(key), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }).then(function () {
        sync.textContent = label + ' — PC 워커가 최대 6분 안에 가져갑니다';
        loadRequests();
      }).catch(function (err) {
        sync.textContent = '실패 — ' + err.message;
      }).then(function () {
        btn.disabled = false; autos.forEach(function (a) { a.disabled = false; });
      });
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var v = text.value.trim();
      if (!v) return;
      send({ text: v, kind: 'manual' }, '요청 등록됨').then(function () {
        text.value = ''; manual.open = false;
      });
    });
    autos[0].addEventListener('click', function () {
      send({ text: '(컨셉 미지정 · IT 용어 계열) 루트·글리치·세션 처럼 개발 용어에서 이름을 딴 새 캐릭터',
             kind: 'auto', theme: 'it' }, 'IT 용어 계열 요청 등록됨');
    });
    autos[1].addEventListener('click', function () {
      send({ text: '(컨셉 미지정 · 그 외 계열) 치비·무기·구미·매화 처럼 IT 와 무관한 이름과 컨셉의 새 캐릭터',
             kind: 'auto', theme: 'free' }, '자유 계열 요청 등록됨');
    });
  }

  var ckptFilled = false;
  function fillCheckpoints(cp) {
    // 목록은 서버가 준 것만 쓴다. 여기에 체크포인트 이름을 적어 두면 낡는다 —
    // 단일 진실은 저장소의 bindings.json 이고 scripts/publish-models.py 가 밀어 넣는다.
    if (ckptFilled || !cp || !cp.models || !cp.models.length) return;
    var sel = document.getElementById('req-model');
    var wrap = document.getElementById('ckpt-wrap');
    if (!sel || !wrap) return;
    cp.models.forEach(function (m) {
      var o = document.createElement('option');
      o.value = m.alias;
      o.textContent = m.alias + (m.alias === cp.default ? ' (기본)' : '');
      o.title = m.file;
      if (m.alias === cp.default) o.selected = true;
      sel.appendChild(o);
    });
    wrap.hidden = false;
    ckptFilled = true;
  }

  function loadRequests() {
    get('requests=1&k=' + encodeURIComponent(key)).then(function (data) {
      fillCheckpoints(data.checkpoints);
      var box = document.getElementById('reqs');
      box.innerHTML = '';
      // 끝난 요청은 목록에서 뺀다 — 쌓인 게 있는지만 보이면 된다
      var open = data.requests.filter(function (r) {
        return r.status === 'pending' || r.status === 'picked';
      });
      var doneCount = data.requests.length - open.length;
      if (open.length || doneCount) {
        var head = document.createElement('p');
        head.className = 'reqs-head';
        head.textContent = open.length
          ? '대기 중 ' + open.length + '건' + (doneCount ? ' · 완료 ' + doneCount + '건' : '')
          : '대기 중인 요청 없음' + (doneCount ? ' · 완료 ' + doneCount + '건' : '');
        box.appendChild(head);
      }
      open.forEach(function (r) {
        var row = document.createElement('div');
        row.className = 'req';
        var p = document.createElement('p');
        p.textContent = r.text;
        if (r.kind === 'auto') {
          var kd = document.createElement('span');
          kd.className = 'kind'; kd.textContent = r.theme === 'free' ? '자동 · 자유' : '자동 · IT';
          p.appendChild(kd);
        }
        if (r.model) {
          var md = document.createElement('span');
          md.className = 'kind'; md.textContent = r.model;
          p.appendChild(md);
        }
        var time = document.createElement('time');
        time.dateTime = r.created;
        time.textContent = r.created.replace('T', ' ').slice(0, 16);
        if (r.batch) time.textContent += ' · ' + r.batch;
        p.appendChild(time);
        var st = document.createElement('span');
        st.className = 'state ' + (r.status === 'done' ? 'accept' : r.status === 'pending' ? 'wait' : '');
        st.textContent = REQ_STATE[r.status] || r.status;
        row.appendChild(p); row.appendChild(st);
        box.appendChild(row);
      });
    }).catch(function () {});
  }


  // ── 테마곡 ──────────────────────────────────────────────────────────────
  // 이미지 심사와 달리 배치가 없다. 주문 하나 = `_music/<id>.json` 이고,
  // composer 가 후보 Suno 링크를 올리면 status 가 review 로 바뀌어 위쪽 판정 칸에 뜬다
  // (음원은 저장하지 않는다 — 링크를 눌러 Suno 에서 듣는다).
  var musicPick = null;

  function bindMusic() {
    var form = document.getElementById('music-form');
    var note = document.getElementById('music-note');
    var btn = document.getElementById('music-send');
    var sync = document.getElementById('music-sync');

    btn.addEventListener('click', function () {
      if (!musicPick) return;
      btn.disabled = true;
      sync.textContent = '보내는 중';
      fetch(API + '?music=1&k=' + encodeURIComponent(key), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ character: musicPick.id, name: musicPick.name,
                               note: note.value.trim() })
      }).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }).then(function () {
        sync.textContent = '주문 등록됨 — PC 워커가 가져갑니다';
        note.value = '';
        musicPick = null;
        form.classList.remove('on');
        loadMusic();
      }).catch(function (err) {
        sync.textContent = '실패 — ' + err.message;
      }).then(function () { btn.disabled = false; });
    });
  }

  // 주문 목록 전체는 그리지 않는다. 지금 만드는 중인 캐릭터에 스피너를 얹고,
  // 제목 옆 점 하나로 전체 상태만 알린다 (빨강 = 만드는 중, 초록 = 다 나옴).
  // 후보가 올라온 주문(review)만 판정 칸으로 그린다 — renderVerdicts
  var musicTimer = null;

  function loadMusic() {
    return get('music=1&k=' + encodeURIComponent(key)).then(function (data) {
      var busy = {}, anyBusy = false, anyDone = false;
      (data.orders || []).forEach(function (o) {
        if (o.status === 'pending' || o.status === 'picked') {
          busy[o.character] = true; anyBusy = true;
        } else if (o.status === 'review' || o.status === 'done') {
          anyDone = true;
        }
      });

      renderRoster(data.roster || [], busy);
      renderVerdicts((data.orders || []).filter(function (o) { return o.status === 'review'; }));

      var dot = document.getElementById('music-dot');
      if (dot) {
        dot.className = 'dot' + (anyBusy ? ' busy' : anyDone ? ' done' : '');
        dot.hidden = !anyBusy && !anyDone;
        dot.title = anyBusy ? '만드는 중' : anyDone ? '곡 나옴' : '';
      }

      // 만드는 중일 때만 다시 본다 — 스피너가 멈춰 있으면 의미가 없다
      if (musicTimer) { clearTimeout(musicTimer); musicTimer = null; }
      if (anyBusy && document.getElementById('roster')) {
        musicTimer = setTimeout(loadMusic, 20000);
      }
    }).catch(function () {});
  }

  // 판정 — ?music=<id> 에 {type: pick|revise|drop, selected, note}. revise 면 워커가 다시 만든다
  function renderVerdicts(orders) {
    var box = document.getElementById('music-review');
    if (!box) return;
    box.innerHTML = '';
    box.hidden = !orders.length;
    orders.forEach(function (o) {
      var card = document.createElement('div');
      card.className = 'verdict';
      var h = document.createElement('h3');
      h.textContent = (o.name || o.character) + (o.title ? ' — ' + o.title : '');
      card.appendChild(h);
      if (o.note) {
        var ask = document.createElement('p');
        ask.className = 'ask'; ask.textContent = '요청: ' + o.note;
        card.appendChild(ask);
      }
      var sync = document.createElement('span');
      sync.className = 'sync';
      var note = document.createElement('textarea');
      note.placeholder = '다시 만들 때 고칠 점 (선택)';
      var buttons = [];
      function send(body) {
        buttons.forEach(function (b) { b.disabled = true; });
        sync.textContent = '보내는 중';
        fetch(API + '?music=' + encodeURIComponent(o.id) + '&k=' + encodeURIComponent(key), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        }).then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        }).then(function () {
          loadMusic();
        }).catch(function (err) {
          sync.textContent = '실패 — ' + err.message;
          buttons.forEach(function (b) { b.disabled = false; });
        });
      }
      (o.tracks || []).forEach(function (t, i) {
        var row = document.createElement('div');
        row.className = 'trk';
        var a = document.createElement('a');
        a.href = t.url; a.target = '_blank'; a.rel = 'noopener';
        a.textContent = t.label || ('후보 ' + (i + 1));
        var pick = document.createElement('button');
        pick.type = 'button'; pick.className = 'pick'; pick.textContent = '이 곡으로';
        pick.addEventListener('click', function () {
          send({ type: 'pick', selected: t.url, note: note.value.trim() });
        });
        buttons.push(pick);
        row.appendChild(a); row.appendChild(pick);
        card.appendChild(row);
      });
      card.appendChild(note);
      var actions = document.createElement('div');
      actions.className = 'row';
      [['revise', '다시 만들기'], ['drop', '폐기']].forEach(function (d) {
        var b = document.createElement('button');
        b.type = 'button'; b.textContent = d[1];
        b.addEventListener('click', function () { send({ type: d[0], note: note.value.trim() }); });
        buttons.push(b);
        actions.appendChild(b);
      });
      actions.appendChild(sync);
      card.appendChild(actions);
      box.appendChild(card);
    });
  }

  function renderRoster(roster, busy) {
    busy = busy || {};
    var box = document.getElementById('roster');
    if (!box) return;
    box.innerHTML = '';
    if (!roster.length) {
      var p = document.createElement('p');
      p.className = 'lead';
      p.textContent = '캐릭터 명단이 아직 없습니다 — PC 에서 scripts/publish-roster.py 를 한 번 돌리세요.';
      box.appendChild(p);
      return;
    }
    var form = document.getElementById('music-form');
    roster.forEach(function (c) {
      var b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('aria-pressed', musicPick && musicPick.id === c.id ? 'true' : 'false');
      var ph = document.createElement('span');
      ph.className = 'ph';
      if (c.thumb) {
        var img = document.createElement('img');
        img.src = c.thumb; img.alt = ''; img.loading = 'lazy';
        ph.appendChild(img);
      }
      if (busy[c.id]) {
        b.classList.add('busy');
        b.title = '곡을 만드는 중';
        var sp = document.createElement('span');
        sp.className = 'spin';
        ph.appendChild(sp);
      }
      b.appendChild(ph);
      var nm = document.createElement('span');
      nm.className = 'nm'; nm.textContent = c.name;
      b.appendChild(nm);
      if (c.grade) {
        var gr = document.createElement('span');
        gr.className = 'gr'; gr.textContent = c.grade;
        b.appendChild(gr);
      }
      b.addEventListener('click', function () {
        var same = musicPick && musicPick.id === c.id;
        musicPick = same ? null : c;
        box.querySelectorAll('button').forEach(function (x) {
          x.setAttribute('aria-pressed', 'false');
        });
        if (!same) b.setAttribute('aria-pressed', 'true');
        form.classList.toggle('on', !!musicPick);
        document.getElementById('music-sync').textContent = '';
      });
      box.appendChild(b);
    });
  }

  if (batch) showDetail(); else showList();
})();
</script>
</body>
</html>
